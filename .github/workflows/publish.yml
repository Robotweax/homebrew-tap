name: Publish Homebrew bottle

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request that qualified the bottle
        required: true
      head_sha:
        description: Full commit SHA of the qualified pull request head
        required: true
      qualification_run:
        description: Successful native brew test-bot run ID for that head
        required: true

permissions: {}

concurrency:
  group: bottle-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PR: ${{ inputs.pull_request }}
      QUALIFIED_HEAD: ${{ inputs.head_sha }}
      QUALIFICATION_RUN: ${{ inputs.qualification_run }}
    steps:
      - name: Check out publication workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify bottle and prepare metadata branch
        id: bottle
        env:
          PR_TOKEN_CONFIGURED: ${{ secrets.BOTTLE_PUBLICATION_PR_TOKEN != '' }}
        run: python3 .github/scripts/publish-bottle.py prepare

      - name: Generate build provenance
        if: steps.bottle.outputs.attested != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.bottle.outputs.path }}

      - name: Publish the verified bottle
        run: python3 .github/scripts/publish-bottle.py publish

      - name: Open or reuse the metadata pull request
        env:
          BOTTLE_PUBLICATION_PR_TOKEN: ${{ secrets.BOTTLE_PUBLICATION_PR_TOKEN }}
        run: python3 .github/scripts/publish-bottle.py open-pr
